# Publish the Circadia container images to GHCR on a v* tag, or on a `workflow_dispatch` on a
# tag sent by release.yml.
#
# The tag is verified against package.json before anything is built, matching
# npm-publish.yml. The build itself lives in the reusable container-build.yml.
name: container-publish

on:
  push:
    tags: ['v*']
  # release.yml dispatches this workflow on the tag it just created, because a tag pushed
  # with GITHUB_TOKEN does not fire the `push` trigger above (workflow_dispatch does).
  # The tag-vs-package.json check below still rejects a dispatch on a non-tag ref.
  workflow_dispatch:

permissions: {}

# Never cancel a release half way.
concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME does not match package.json version $v"
            exit 1
          fi

  # The image build stage does not run the test suite: it spawns child node processes
  # that are too slow under QEMU emulation in the multi-arch build and hang. Run the
  # suite once, natively, on the runner instead.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false

      - run: npm ci
      - run: npm test

  publish:
    needs: [verify-tag, test]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        # The Dockerfile's final stage is `server`, so the stdio image must name
        # `runtime` explicitly.
        include:
          - image-name: circadia
            target: runtime
          - image-name: circadia-server
            target: server
    uses: ./.github/workflows/container-build.yml
    with:
      image-name: ${{ matrix.image-name }}
      target: ${{ matrix.target }}
      push: true
