# Cut a release automatically when a labeled PR merges into main.
#
# Label-driven: a PR carries one (or more) of `release:major`, `release:minor`,
# `release:patch`. On merge this workflow bumps package.json, commits, tags `vX.Y.Z` on main,
# and creates a GitHub Release. A merged PR with no `release:*` label just merges; nothing is
# published (so docs/chore PRs do not churn versions).
#
# WHY `gh workflow run` INSTEAD OF A PAT:
#   Everything here authenticates with the built-in `GITHUB_TOKEN`. A tag pushed with
#   `GITHUB_TOKEN` does NOT trigger other workflows (GitHub suppresses recursive runs), so the
#   `push: tags` trigger on npm-publish.yml / container-publish.yml never fires for the auto
#   release. Rather than push with a PAT, this workflow *dispatches* those two workflows on the
#   new tag with `gh workflow run`. `workflow_dispatch` is the documented exception to the
#   suppression rule — it fires even when triggered by `GITHUB_TOKEN` — so no PAT, GitHub App,
#   or repo secret is needed. The same workflows still publish when a human pushes a tag by
#   hand (that `push` event is not suppressed).
#
# ONE-TIME SETUP
#   1. Create the three labels `release:major`, `release:minor`, `release:patch`.
#   2. If branch protection blocks direct pushes to main, allow the GitHub Actions app to
#      bypass it (via rulesets), or the release commit is rejected.
#
# Precedence: major > minor > patch (the first match wins).
name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

# Never let two releases race on main.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bump commit + tag and create the Release
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - name: Determine the bump from the PR labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bump="none"
          for level in major minor patch; do
            if [[ " $LABELS " == *" release:$level "* ]]; then bump="$level"; break; fi
          done
          if [[ "$bump" == "none" ]]; then
            echo "No release:* label on #$PR; nothing to release."
          else
            echo "Releasing a $bump bump for #$PR."
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bump.outputs.bump != 'none'
        with:
          ref: main
          fetch-depth: 0
          # Keep the default `GITHUB_TOKEN` credentials so the push below authenticates as
          # github-actions[bot]. No PAT remote rewrite is needed.
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.bump.outputs.bump != 'none'
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false # never restore caches into a release

      - name: Bump, commit, tag, and push
        id: push
        if: steps.bump.outputs.bump != 'none'
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # npm version commits `chore: release vX.Y.Z` and creates the matching v tag.
          npm version "$BUMP" -m "chore: release v%s"
          version="$(node -p "require('./package.json').version")"
          # checkout persisted the GITHUB_TOKEN credentials; these pushes authenticate as
          # github-actions[bot]. This same-repo PR merge grants the `contents: write` above.
          git push origin HEAD:main
          git push origin "v${version}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        if: steps.bump.outputs.bump != 'none'
        env:
          # GITHUB_TOKEN with contents: write can create releases on this repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.push.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  # The tag push above used GITHUB_TOKEN, so it did not trigger the tag-triggered publish
  # workflows. Dispatch them explicitly on the tag. `gh workflow run` needs `actions: write`;
  # this job does nothing else.
  dispatch-publishes:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # create the workflow_dispatch events
    steps:
      - name: Dispatch the npm and container publishes on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          for wf in npm-publish.yml container-publish.yml; do
            echo "Dispatching $wf at $TAG"
            gh workflow run "$wf" --repo "$REPO" --ref "$TAG"
          done
