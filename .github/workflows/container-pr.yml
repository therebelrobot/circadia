# CI for the container image: build for linux/amd64 without pushing, then run
# the same smoke tests a human runs locally (scripts/container-smoke.sh).
name: container-pr

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container-*.yml'
      - 'scripts/container-smoke.sh'
      - 'scripts/container-smoke-helpers.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'bin/**'
      - 'src/**'
      - 'templates/**'
      - 'examples/vault/**'

permissions: {}

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: circadia:pr
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false

      - run: npm ci

      - name: Smoke test the image
        run: ./scripts/container-smoke.sh circadia:pr
