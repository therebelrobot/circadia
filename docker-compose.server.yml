# Example: run the Circadia server image on a private network.
#
#   head -c 48 /dev/urandom | base64 > circadia-write-token
#   docker compose -f docker-compose.server.yml up -d
#
# The image is the stdio image plus a `serve` entrypoint. Same hardening: non-root, a
# read-only root filesystem, the vault the only writable mount, and an ephemeral /tmp.
# See docs/rfcs/RFC-0003-server-container.md and docs/SECURITY.md T2.
#
# Pin the image by version tag, or better a digest.

services:
  circadia:
    image: ghcr.io/therebelrobot/circadia-server:<version>
    restart: unless-stopped

    # The vault is the only writable host mount. `user` must own it on the host so the
    # container can write episodes and the index; find it with `id -u` and `id -g`.
    user: "1000:1000"
    volumes:
      - ./vault:/vault
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      # Inside a container, 127.0.0.1 is the container itself, so a published port cannot
      # reach it. The image deliberately does not set this; the operator opts in.
      CIRCADIA_BIND: "0.0.0.0"
      # The token comes from a Docker secret, never the vault config.
      CIRCADIA_WRITE_TOKEN_FILE: /run/secrets/circadia_write_token
      # Optional read-only token:
      # CIRCADIA_READ_TOKEN_FILE: /run/secrets/circadia_read_token
      # Point the model endpoints at the host or a sibling service; 127.0.0.1 is the
      # container, not the host. Example:
      # CIRCADIA_EXTRACTION_ENDPOINT: http://<docker-host>:8080/v1/chat/completions
    secrets:
      - circadia_write_token

    # Default: publish on the host's loopback only, so other LAN machines cannot reach it.
    # To serve the LAN, change the map to "0.0.0.0:8711:8711" and read docs/SECURITY.md T2
    # first: from then on the bearer token is the only gate. Prefer a reverse proxy that
    # terminates TLS.
    ports:
      - "127.0.0.1:8711:8711"

    healthcheck:
      test: ["CMD", "circadia", "serve", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - internal

secrets:
  circadia_write_token:
    file: ./circadia-write-token
  # circadia_read_token:
  #   file: ./circadia-read-token

# `internal: true` blocks egress. Join a second, non-internal network only if the model
# endpoint is hosted; a local llama.cpp on this network needs no egress.
networks:
  internal:
    internal: true
